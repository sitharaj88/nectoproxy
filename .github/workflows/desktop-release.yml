name: Desktop Release

# Builds the NectoProxy desktop app (Tauri v2) for macOS, Windows and Linux and
# uploads the bundles to a draft GitHub Release. Triggered by pushing a tag like
# `desktop-v0.1.2` (kept separate from the npm `v*` release tags), or manually.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.args }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel macOS
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard Tauri v2 Linux system dependencies (WebKitGTK 4.1 etc.).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Darwin targets are needed on the macOS runners.
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # The desktop package is new to the workspace, so the committed lockfile
      # does not include @tauri-apps/cli yet — allow pnpm to update it in CI.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Expand the placeholder icon.png into the platform icon files that
      # tauri.conf.json references (they are gitignored, not committed).
      - name: Generate app icons
        run: pnpm --filter @nectoproxy/desktop tauri icon apps/desktop/src-tauri/icons/icon.png

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and provide these secrets to enable the updater signing:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "NectoProxy Desktop ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the NectoProxy desktop app for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

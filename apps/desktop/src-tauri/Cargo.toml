[package]
name = "nectoproxy-desktop"
version = "0.1.2"
description = "NectoProxy Desktop — a native window for the NectoProxy HTTP/HTTPS debugging proxy"
authors = ["Sitharaj Seenivasan"]
license = "MIT"
repository = "https://github.com/sitharaj88/nectoproxy"
edition = "2021"
rust-version = "1.77.2"

# The application logic lives in a library crate so that it can be reused by the
# desktop binary (main.rs) and, in the future, mobile entry points. This mirrors
# the standard Tauri v2 project layout.
[lib]
name = "nectoproxy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# Release profile tuned for smaller, faster bundles.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
